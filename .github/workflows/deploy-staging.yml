name: Deploy POSGRO Staging

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Needed only for .github/actions/ssh-deploy — the deploy scripts themselves
      # are pulled on the VPS from the branch being deployed.
      - uses: actions/checkout@v5

      - name: Deploy to staging
        uses: ./.github/actions/ssh-deploy
        with:
          host:          ${{ secrets.SSH_HOST }}
          username:      ${{ secrets.SSH_USER }}
          key:           ${{ secrets.SSH_KEY }}
          known_hosts:   ${{ secrets.SSH_KNOWN_HOSTS }}
          env_file:      ${{ secrets.ENV_FILE }}
          gh_pat:        ${{ secrets.GH_PAT }}
          repo_owner:    Bobur815
          repo_name:     posgro
          branch:        dev
          project_dir:   posgro-staging
          deploy_script: scripts/deploy/staging.sh
