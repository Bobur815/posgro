name: Deploy POSGRO Backend

on:
  schedule:
    - cron: '0 18 * * *'  # 23:00 Tashkent (UTC+5)
  workflow_dispatch:  # manual trigger from GitHub Actions UI if needed

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Needed only for .github/actions/ssh-deploy — the deploy scripts themselves
      # are pulled on the VPS from the branch being deployed.
      - uses: actions/checkout@v4

      - name: Deploy to production
        uses: ./.github/actions/ssh-deploy
        with:
          host:          ${{ secrets.SSH_HOST }}
          username:      ${{ secrets.SSH_USER }}
          key:           ${{ secrets.SSH_KEY }}
          known_hosts:   ${{ secrets.SSH_KNOWN_HOSTS }}
          env_file:      ${{ secrets.ENV_FILE }}
          gh_pat:        ${{ secrets.GH_PAT }}
          repo_owner:    Bobur815
          repo_name:     posgro
          branch:        main
          project_dir:   posgro
          deploy_script: scripts/deploy/production.sh
