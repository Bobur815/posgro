# POSGRO — the main landing page (apex + www).
#
# Deployed by scripts/deploy/production.sh; see nginx/README.md for the certbot bootstrap.
#
# Live since 2026-09-29: the apex points at this VPS through Cloudflare (proxied; SSL/TLS mode
# must be Full (strict)), and the posgro.uz certificate covers www too.
#
# Static only, deliberately: no API, no NestJS, no database. The landing page must stay up when
# the API is down, because that is exactly when people visit it looking for support contacts.

server {
    listen 80;
    listen [::]:80;
    server_name posgro.uz www.posgro.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://posgro.uz$request_uri;
    }
}

# www → apex, so the site has exactly one canonical address.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.posgro.uz;

    ssl_certificate     /etc/letsencrypt/live/posgro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posgro.uz/privkey.pem;
    include snippets/posgro-ssl.conf;

    return 301 https://posgro.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name posgro.uz;

    ssl_certificate     /etc/letsencrypt/live/posgro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posgro.uz/privkey.pem;
    include snippets/posgro-ssl.conf;

    # Populated by scripts/deploy/production.sh, which copies dist/landing out of the API image
    # onto the host — no manual step, and `cp -r` creates this directory on the first deploy.
    # The page is static on purpose: see the header comment.
    root /var/www/posgro-landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached hard; index.html must not be, or a redesign never lands.
    location ~* \.(?:css|js|woff2?|png|jpe?g|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
}
