# POSGRO — the main landing page (apex + www).
#
# Deployed by scripts/deploy/production.sh; see nginx/README.md for the certbot bootstrap.
#
# Live since 2026-09-29: the apex points at this VPS through Cloudflare (proxied; SSL/TLS mode
# must be Full (strict)), and the posgro.uz certificate covers www too.
#
# Static only, deliberately: no API, no NestJS, no database. The landing page must stay up when
# the API is down, because that is exactly when people visit it looking for support contacts.

# /media/ caching (see the location below). hero-<version>-* never change — a new upload gets new
# names — so they are immutable. The fixed hero-poster.* aliases index.html preloads are replaced
# on every upload, so they are short. A map, not nested locations: alias does not carry cleanly
# into nested regex locations.
map $uri $posgro_media_cache {
    ~^/media/hero-\d+-      "public, max-age=31536000, immutable";
    default                 "public, max-age=300";
}

server {
    listen 80;
    listen [::]:80;
    server_name posgro.uz www.posgro.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://posgro.uz$request_uri;
    }
}

# www → apex, so the site has exactly one canonical address.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.posgro.uz;

    ssl_certificate     /etc/letsencrypt/live/posgro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posgro.uz/privkey.pem;
    include snippets/posgro-ssl.conf;

    return 301 https://posgro.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name posgro.uz;

    ssl_certificate     /etc/letsencrypt/live/posgro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posgro.uz/privkey.pem;
    include snippets/posgro-ssl.conf;

    # Populated by scripts/deploy/production.sh, which copies dist/landing out of the API image
    # onto the host — no manual step, and `cp -r` creates this directory on the first deploy.
    # The page is static on purpose: see the header comment.
    root /var/www/posgro-landing;
    index index.html;

    # Renewals for this host (certbot --webroot) arrive over HTTPS too: Cloudflare may upgrade them.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The hero video and posters, uploaded from the dashboard (LandingHeroVideoService). Straight
    # from disk, so the video plays with the API down; Range/206 comes with nginx's static module.
    # `^~` is required: without it the image regex below wins for the posters and looks for them
    # in the landing root. A missing file is a real 404 (no try_files → no index.html fallback),
    # which is what the poster's onError relies on. Own add_header → the snippet's security
    # headers are dropped here, as for /uploads/ on the other hosts (see posgro-ssl.conf).
    location ^~ /media/ {
        alias /home/bobur/posgro/uploads/landing/;
        add_header Cache-Control $posgro_media_cache;
        access_log off;
    }

    # Hashed build assets can be cached hard; index.html must not be, or a redesign never lands.
    location ~* \.(?:css|js|woff2?|png|jpe?g|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
}
