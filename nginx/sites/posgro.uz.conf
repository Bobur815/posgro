# POSGRO — the main landing page (apex + www).
#
# Deployed by scripts/deploy/production.sh; see nginx/README.md for the certbot bootstrap.
#
# ⚠️ THIS HOST CANNOT GET A CERTIFICATE UNTIL THE APEX A RECORD MOVES.
# posgro.uz still points at 45.138.159.4 (the old shared hosting). Until it points at this VPS,
# HTTP-01 validation for posgro.uz and www.posgro.uz will fail and the deploy script will
# install an ACME stub for this host instead of the block below. That is expected and harmless
# — flip the apex last, per the plan (§4), then re-run certbot and deploy again.
#
# Static only, deliberately: no API, no NestJS, no database. The landing page must stay up when
# the API is down, because that is exactly when people visit it looking for support contacts.

server {
    listen 80;
    listen [::]:80;
    server_name posgro.uz www.posgro.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://posgro.uz$request_uri;
    }
}

# www → apex, so the site has exactly one canonical address.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.posgro.uz;

    ssl_certificate     /etc/letsencrypt/live/posgro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posgro.uz/privkey.pem;
    include snippets/posgro-ssl.conf;

    return 301 https://posgro.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name posgro.uz;

    ssl_certificate     /etc/letsencrypt/live/posgro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posgro.uz/privkey.pem;
    include snippets/posgro-ssl.conf;

    # ONE-TIME MANUAL STEP before this host goes live — the deploy runs as `bobur`, whose sudo
    # cannot mkdir, so this directory has to be created by hand once:
    #   sudo mkdir -p /var/www/posgro-landing && sudo chown bobur:bobur /var/www/posgro-landing
    # After that the landing build can be copied in by the deploy like any other file.
    # Not urgent: this host stays an ACME stub until the apex A record moves.
    root /var/www/posgro-landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached hard; index.html must not be, or a redesign never lands.
    location ~* \.(?:css|js|woff2?|png|jpe?g|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
}
