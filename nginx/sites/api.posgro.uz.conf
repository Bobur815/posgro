# POSGRO — the POS API host. This is the value of VPS_API_URL on every terminal.
#
#   VPS_API_URL=https://api.posgro.uz/api
#
# Deployed by scripts/deploy/production.sh; see nginx/README.md for the certbot bootstrap.
#
# This host must serve BOTH /api/ and /uploads/. The terminal derives the image origin from its
# own API URL by stripping "/api" (src/main/ipc/banner-handlers.ts:85-88), so a login banner is
# fetched from https://api.posgro.uz/uploads/<file>. Drop the /uploads/ block and every till in
# the field loses its login banner.

# Distinct zone name: the legacy pos.bobur-dev.uz block declares `pos_api` and both files are
# included into the same http{} context. Reusing the name is a duplicate-zone startup error.
limit_req_zone $binary_remote_addr zone=posgro_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.posgro.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.posgro.uz;

    ssl_certificate     /etc/letsencrypt/live/api.posgro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.posgro.uz/privkey.pem;
    include snippets/posgro-ssl.conf;

    # Matches the legacy host exactly — receipt-image uploads from the till need the headroom.
    client_max_body_size 25M;

    # Nothing to browse here. The dashboard is on web.posgro.uz.
    location = / {
        return 301 https://posgro.uz;
    }

    location /api/ {
        limit_req zone=posgro_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include snippets/posgro-proxy.conf;
    }

    # Banner and product images. Same directory the legacy host serves, so a terminal sees byte
    # identical responses whichever host it is pointed at.
    location /uploads/ {
        alias /home/bobur/posgro/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Top-level health check for monitoring.
    #
    # NOTE the target path. The application registers ONLY /api/health
    # (src/server/main.ts:85) — there is no bare /health on :3001. The legacy
    # pos.bobur-dev.uz block proxies /health → :3001/health and has therefore always
    # answered 404; nothing noticed because nothing used it. probeApiUrl() in the terminal
    # asks for `${apiUrl}/health`, i.e. /api/health, which is served by the /api/ block above.
    location = /health {
        proxy_pass http://127.0.0.1:3001/api/health;
        include snippets/posgro-proxy.conf;
    }
}
