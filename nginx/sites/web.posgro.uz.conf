# POSGRO — the super-admin / store-owner dashboard (src/web).
#
# Deployed by scripts/deploy/production.sh; see nginx/README.md for the certbot bootstrap.
#
# SAME-ORIGIN BY DESIGN (plan Decision 3). This host proxies /api and /uploads to the same
# backend as api.posgro.uz, so the dashboard keeps resolving its API at "/api"
# (src/web/src/api/client.ts:21) exactly as it does today: no VITE_API_URL, no CORS
# preflight, no credentialed cross-origin auth. Moving the dashboard to its own hostname
# therefore costs no application code.
#
# SERVES BOTH PATHS, BEFORE AND AFTER THE PHASE 3 MOVE. NestJS serves the SPA under the /web
# prefix (src/server/main.ts:22-24) and that stays true; only the public path moves. Two
# locations cover both regimes, because nginx picks the LONGEST matching prefix:
#
#   today   (vite base '/web/'): GET /            → /web/ → index.html asks for /web/assets/*
#                                GET /web/assets/ → matches `location /web`  → served
#   phase 3 (vite base '/')    : GET /            → /web/ → index.html asks for /assets/*
#                                GET /assets/     → matches `location /`     → /web/assets/*
#
# ⚠️ TODAY THE WORKING URL IS https://web.posgro.uz/web/ — NOT the root. nginx serves index.html
# and its assets at the root perfectly well, but the app does not render there: the router is
# pinned by `BrowserRouter basename="/web"` (src/web/src/App.tsx:67, confirmed in the deployed
# bundle as `basename:"/web"`), so at "/" it matches no route and renders null. Serving the
# files is not the same as mounting the app, and a 200 does not prove the page works.
#
# PHASE 3 makes the root the real home: set `base: '/'` in src/web/vite.config.ts AND change
# that basename to '/'. Both, or it breaks. This nginx file needs no edit either way — do not
# "simplify" by deleting the /web block, which is what serves the current build.

server {
    listen 80;
    listen [::]:80;
    server_name web.posgro.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name web.posgro.uz;

    ssl_certificate     /etc/letsencrypt/live/web.posgro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.posgro.uz/privkey.pem;
    include snippets/posgro-ssl.conf;

    client_max_body_size 25M;

    # Driver, tool and manual uploads for panel.posgro.uz. These are installers — the 25M cap
    # above is sized for receipt photos and would reject them at the edge, before Nest or multer
    # ever see the request. Longer prefix than `location /api/`, so this wins for these routes.
    # Kept to this path rather than raised globally: nothing else has any business posting 512M.
    location /api/downloads {
        proxy_pass http://127.0.0.1:3001;
        include snippets/posgro-proxy-upload.conf;
    }

    # Same-origin API for the dashboard.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        include snippets/posgro-proxy.conf;
    }

    location /uploads/ {
        alias /home/bobur/posgro/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001/api/health;
        include snippets/posgro-proxy.conf;
    }

    # Asset requests from a build with base '/web/'. Longest-prefix wins over `location /`.
    location /web {
        proxy_pass http://127.0.0.1:3001;
        include snippets/posgro-proxy.conf;
    }

    # The dashboard at the root of this host. The trailing slash on proxy_pass is what rewrites
    # /settings → /web/settings, which the SPA fallback (src/server/main.ts:87-91) then answers
    # with index.html.
    location / {
        proxy_pass http://127.0.0.1:3001/web/;
        include snippets/posgro-proxy.conf;
    }
}
