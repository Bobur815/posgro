# POSGRO — VPS host nginx config
# Deploy to: /etc/nginx/sites-available/pos.bobur-dev.uz
# Enable:    sudo ln -sf /etc/nginx/sites-available/pos.bobur-dev.uz /etc/nginx/sites-enabled/
# SSL cert:  sudo certbot --nginx -d pos.bobur-dev.uz

# Rate limiting
limit_req_zone $binary_remote_addr zone=pos_api:10m rate=10r/s;

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name pos.bobur-dev.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pos.bobur-dev.uz;

    ssl_certificate     /etc/letsencrypt/live/pos.bobur-dev.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.bobur-dev.uz/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache   shared:POS_SSL:10m;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Increase body size limit for receipt image uploads
    client_max_body_size 25M;

    # PHASE 2 — this host is now redundant for PEOPLE, and unchanged for MACHINES.
    #
    # Human-facing paths (/ and /web) redirect to posgro.uz; the machine paths below
    # (/api/, /releases/, /uploads/) keep serving exactly as before and MUST NOT redirect:
    # every terminal in the field still has this host in local_config.api_url, and its
    # compiled updater still fetches /releases/ from here. See tasks/DOMAIN_MIGRATION_POSGRO.md §6.
    #
    # Target keeps the /web prefix on purpose: the dashboard's router is pinned to it
    # (BrowserRouter basename="/web", src/web/src/App.tsx:67), so web.posgro.uz/ renders
    # nothing today. Phase 3 moves the app to the root and this becomes a bare host redirect.
    # Once the landing page is live, / points at https://posgro.uz instead.
    location = / {
        return 301 https://web.posgro.uz/web/;
    }

    # Static release files for Electron auto-updater
    location /releases/ {
        alias /home/bobur/releases/;
        autoindex off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types { application/octet-stream exe; text/yaml yml; }
    }

    # Uploaded banner/product images (persisted on host via Docker bind-mount)
    location /uploads/ {
        alias /home/bobur/posgro/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API
    location /api/ {
        limit_req zone=pos_api burst=20 nodelay;

        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Web app → moved to its own host. $request_uri carries the full path and query, so a
    # bookmark or a QR deep link lands on the same page: /web/products?x=1 keeps working.
    #
    # This also quietly fixes every terminal already in the field: the till's dashboard QR is
    # built as apiUrl-minus-/api + "/web" (src/main/ipc/handlers.ts:959), which on an unmigrated
    # terminal is exactly https://pos.bobur-dev.uz/web — so scanning it now arrives at the new
    # dashboard without the terminal being touched.
    #
    # 301 is safe here and only here: this path serves a browser SPA, never an API call with a
    # bearer token or a POST body.
    location /web {
        return 301 https://web.posgro.uz$request_uri;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
