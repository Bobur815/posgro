# POSGRO — public download portal: the POS installer, printer drivers, scale tools, manuals.
#
# Deployed by scripts/deploy/production.sh; see nginx/README.md for the certbot bootstrap.
#
# Phase 1 serves a static placeholder at / so the host is verifiable end to end. The portal app
# itself (src/panel, plan §8) lands in Phase 3 and replaces the `location /` block below.
#
# /releases/ is the important part and is live from day one: it aliases the SAME directory the
# legacy pos.bobur-dev.uz host serves, so the updater feed is identical over either hostname.
# That is what lets a new release be published once and fetched by both migrated and
# unmigrated terminals.

server {
    listen 80;
    listen [::]:80;
    server_name panel.posgro.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.posgro.uz;

    ssl_certificate     /etc/letsencrypt/live/panel.posgro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.posgro.uz/privkey.pem;
    include snippets/posgro-ssl.conf;

    # Electron auto-updater feed. Byte-identical to pos.bobur-dev.uz/releases/ — same directory.
    # No caching: latest.yml must never be served stale or terminals miss a release.
    location /releases/ {
        alias /home/bobur/releases/;
        autoindex off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types { application/octet-stream exe; text/yaml yml; }
    }

    # Uploaded tools and drivers (plan §8.3, DownloadItem.filePath). Empty until Phase 3 —
    # the directory is created by the deploy script so this is a 404, not a 500.
    location /downloads/ {
        alias /home/bobur/posgro/downloads/;
        autoindex off;
        expires 1h;
        add_header Cache-Control "public";
    }

    # PHASE 3: replace this block with the portal app —
    #   location / { proxy_pass http://127.0.0.1:3001/panel/; include snippets/posgro-proxy.conf; }
    # and set `base: '/'` in src/panel/vite.config.ts.
    #
    # Served from the config rather than a document root on purpose: the deploy runs as `bobur`,
    # whose sudo cannot mkdir, so a root directory here would have to be created by hand before
    # this host could answer anything but 404. A literal keeps Phase 1 verifiable with no manual
    # step on the VPS.
    location / {
        default_type text/plain;
        return 200 "POSGRO panel\n";
    }
}
