# POSGRO Staging — the public download portal. Mirrors nginx/sites/panel.posgro.uz.conf
# against :3002.
#
# Deployed by scripts/deploy/staging.sh; see nginx/README.md for the certbot bootstrap.
#
# This host is what makes the portal clickable before it faces customers: the app is built with
# base '/', so it can only live at a host root — there is no sub-path to bolt it onto.

server {
    listen 80;
    listen [::]:80;
    server_name dev.panel.posgro.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.panel.posgro.uz;

    ssl_certificate     /etc/letsencrypt/live/dev.panel.posgro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.panel.posgro.uz/privkey.pem;
    include snippets/posgro-ssl.conf;

    # The SAME release directory production serves. Staging deliberately offers the real
    # installer: the portal's hero is only proved by the feed the updater actually reads, and a
    # fake one here would test nothing.
    location /releases/ {
        alias /home/bobur/releases/;
        autoindex off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        types { application/octet-stream exe; text/yaml yml; }
    }

    # Staging's own tools directory — uploading a driver here must not publish it to the live
    # portal. Matches DOWNLOADS_DIR in docker-compose.staging.yml.
    location /downloads/ {
        alias /home/bobur/posgro-staging/downloads-staging/;
        autoindex off;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        include snippets/posgro-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3002/panel/;
        include snippets/posgro-proxy.conf;
    }
}
