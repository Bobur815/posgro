# POSGRO Staging — the POS API host. Mirrors nginx/sites/api.posgro.uz.conf against :3002.
#
# Deployed by scripts/deploy/staging.sh; see nginx/README.md for the certbot bootstrap.
#
# For a terminal built against staging:
#   VPS_API_URL=https://dev.api.posgro.uz/api

# Distinct zone name: every file in sites-enabled shares one http{} context, and production's
# `posgro_api` plus the legacy staging host's `pos_staging_api` are already taken.
limit_req_zone $binary_remote_addr zone=posgro_staging_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name dev.api.posgro.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.api.posgro.uz;

    ssl_certificate     /etc/letsencrypt/live/dev.api.posgro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.api.posgro.uz/privkey.pem;
    include snippets/posgro-ssl.conf;

    client_max_body_size 25M;

    location = / {
        return 301 https://dev.web.posgro.uz/web/;
    }

    # Installer and driver uploads — see the production file for why this is scoped to the route.
    location /api/downloads {
        proxy_pass http://127.0.0.1:3002;
        include snippets/posgro-proxy-upload.conf;
    }

    location /api/ {
        limit_req zone=posgro_staging_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3002;
        include snippets/posgro-proxy.conf;
    }

    # Staging's own uploads directory — a banner set here must not appear on a real till.
    location /uploads/ {
        alias /home/bobur/posgro-staging/uploads-staging/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3002/api/health;
        include snippets/posgro-proxy.conf;
    }
}
