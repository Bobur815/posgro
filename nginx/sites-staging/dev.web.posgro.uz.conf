# POSGRO Staging — the dashboard. Mirrors nginx/sites/web.posgro.uz.conf against :3002.
#
# Deployed by scripts/deploy/staging.sh; see nginx/README.md for the certbot bootstrap.
#
# Same-origin by design and same dual-location arrangement as production: today the working URL
# is /web/ (BrowserRouter basename="/web"), and it keeps working when Phase 3 moves the app to
# the root. See nginx/sites/web.posgro.uz.conf for the full reasoning.

server {
    listen 80;
    listen [::]:80;
    server_name dev.web.posgro.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.web.posgro.uz;

    ssl_certificate     /etc/letsencrypt/live/dev.web.posgro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.web.posgro.uz/privkey.pem;
    include snippets/posgro-ssl.conf;

    client_max_body_size 25M;

    location /api/downloads {
        client_max_body_size 512M;
        client_body_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:3002;
        include snippets/posgro-proxy.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        include snippets/posgro-proxy.conf;
    }

    location /uploads/ {
        alias /home/bobur/posgro-staging/uploads-staging/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3002/api/health;
        include snippets/posgro-proxy.conf;
    }

    # Assets from a build with base '/web/'. Longest prefix wins over `location /`.
    location /web {
        proxy_pass http://127.0.0.1:3002;
        include snippets/posgro-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3002/web/;
        include snippets/posgro-proxy.conf;
    }
}
