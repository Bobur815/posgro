# Compress text responses for one server block. Deployed to /etc/nginx/snippets/ by the deploy
# scripts and included at SERVER level, never in /etc/nginx/nginx.conf: the VPS is shared with
# other projects, and their hosts must not change because of ours.
#
# Why: measured 2026-10-03 from Fergana, the route to this VPS carries ~60 KB/s while the API
# answers in ~0.1 s, and nothing was compressed — Ubuntu's default `gzip on` covers text/html
# only. GET /api/products (3 MB of JSON) took 1.1 min; JSON like it shrinks ~8–10×.
#
# Safe for any client: nginx compresses only when the request sends Accept-Encoding, and leaves a
# response that already carries Content-Encoding alone (so no double compression if Nest ever
# adds its own).
#
# Do NOT include this in a server block that already sets any gzip_* directive itself: nginx
# rejects a duplicate directive in the same context outright.

gzip on;
gzip_vary on;
# Requests that arrived through a proxy (Via header) too — e.g. if a host goes behind Cloudflare.
gzip_proxied any;
# 5 is most of the gain of 9 for a fraction of the CPU.
gzip_comp_level 5;
# Below ~1 KB the gzip header costs more than it saves.
gzip_min_length 1024;
# text/html is always compressed once gzip is on; listing it again only logs a warning.
gzip_types
    application/json
    application/javascript
    text/javascript
    text/css
    text/plain
    image/svg+xml
    application/manifest+json;
