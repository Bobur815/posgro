# Proxy settings for the driver/tool upload route (POST /api/downloads).
#
# Use this INSTEAD of posgro-proxy.conf — not alongside it. Both set the same timeout
# directives, and nginx treats a directive repeated in one context as a configuration error,
# not an override.
#
# These are installers of hundreds of megabytes: the 25M body cap and two-minute timeouts that
# suit a receipt photo would reject them at the edge, before Nest or multer ever see the request.
# Scoped to this one route deliberately — nothing else has any business posting 512M.

include snippets/posgro-proxy-headers.conf;

client_max_body_size 512M;
# A large upload on a shop's connection takes minutes; the defaults would cut it off.
client_body_timeout   600s;
proxy_connect_timeout 60s;
proxy_send_timeout    600s;
proxy_read_timeout    600s;
