# Proxy headers shared by every route that forwards to the NestJS API.
#
# Headers only, no timeouts — those differ between normal routes and upload routes, and nginx
# treats a directive repeated in one context as a hard error rather than an override. Splitting
# them is what lets posgro-proxy.conf and posgro-proxy-upload.conf share this without either
# duplicating the other.
#
# Identical to the header set the legacy pos.bobur-dev.uz block has always sent, so a request
# arriving over a new host is indistinguishable to the application from one over the old host.

proxy_http_version 1.1;
proxy_set_header   Upgrade           $http_upgrade;
proxy_set_header   Connection        'upgrade';
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_cache_bypass $http_upgrade;
