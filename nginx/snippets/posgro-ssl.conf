# Shared TLS + security headers for every posgro.uz host.
# Deployed to /etc/nginx/snippets/posgro-ssl.conf by scripts/deploy/production.sh.
#
# The certificate paths are NOT here — they differ per host and stay in the site file, which is
# also what lets the deploy script detect a missing certificate and fall back to an ACME stub.

ssl_session_timeout 1d;
ssl_session_cache   shared:POSGRO_SSL:10m;
ssl_session_tickets off;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
ssl_prefer_server_ciphers off;

# nginx inherits add_header from an outer level ONLY if the inner level declares none of its
# own. So a location that sets its own Cache-Control (/uploads/, /releases/, /downloads/) drops
# these three. That is fine and matches how the legacy host has always behaved: HSTS is scoped
# to the host, not the response, and the browser has already taken the policy from the page and
# API responses. Re-list them in such a location only if you need the frame/nosniff headers on
# that asset specifically.
add_header Strict-Transport-Security "max-age=63072000" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header X-Content-Type-Options    "nosniff" always;
