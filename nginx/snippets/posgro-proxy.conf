# Standard proxy settings for routes that forward to the NestJS API on 127.0.0.1:3001 (:3002 on
# staging). Deployed to /etc/nginx/snippets/ by the deploy scripts.
#
# Do NOT also set proxy_read_timeout or proxy_send_timeout in a location that includes this:
# nginx rejects a duplicate directive in the same context outright — it does not treat the
# nearer one as an override. For a route that needs longer, include posgro-proxy-upload.conf
# INSTEAD of this file.

include snippets/posgro-proxy-headers.conf;

proxy_connect_timeout 60s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;
